<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도매시장 경락가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 메인에서 시장을 고르고(#시장id), 시장 화면에서 품목 시세를 훑는다. 자주 보는 시장은 위에 큰 카드로 고정. */
:root{
  --bg:#f3f5f1;
  --surface:#ffffff;
  --ink:#16221b;
  --muted:#5f6d64;
  --line:#dde3dc;
  --accent:#1d6b45;
  --accent-soft:#e3efe7;
  --up:#cf3327;
  --up-soft:#fbe9e6;
  --down:#1f5fbf;
  --down-soft:#e6eefb;
  --warn-bg:#fff4d6;
  --warn-ink:#6b4a00;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101612;--surface:#18211c;--ink:#e8efe9;--muted:#9aa89f;--line:#2a362f;
    --accent:#6cc494;--accent-soft:#1d3327;
    --up:#ff7a6b;--up-soft:#3a1d1a;--down:#7fb0ff;--down-soft:#18273f;
    --warn-bg:#3a2f10;--warn-ink:#f3d98a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101612;--surface:#18211c;--ink:#e8efe9;--muted:#9aa89f;--line:#2a362f;
  --accent:#6cc494;--accent-soft:#1d3327;
  --up:#ff7a6b;--up-soft:#3a1d1a;--down:#7fb0ff;--down-soft:#18273f;
  --warn-bg:#3a2f10;--warn-ink:#f3d98a;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
.num{font-variant-numeric:tabular-nums}

header{padding:20px 0 12px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.date{color:var(--muted);font-size:13px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;margin-top:4px}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.notice.ok{background:var(--accent-soft);color:var(--accent)}
.notice b{font-weight:600;white-space:nowrap}

/* 메인 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;min-height:96px}
.mcard .mn{font-family:var(--display);font-size:24px;line-height:1.15}
.mcard .mr{font-size:12px;color:var(--muted)}
.mcard .ms{margin-top:auto;font-size:13px;display:flex;gap:10px;padding-top:6px}
.mcard .ms.off{color:var(--muted)}
.up-t{color:var(--up);font-weight:600}.down-t{color:var(--down);font-weight:600}
.pinhint{margin:0;padding:18px 12px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.search{width:100%;margin-bottom:8px}
.region{margin:12px 0 0}
.region h3{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px;padding-left:2px}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow a{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 14px;min-height:52px;text-decoration:none;color:inherit;min-width:0}
.mrow .nm{font-weight:600}
.mrow .sb{font-size:12px;color:var(--muted)}
.pinbtn{flex:none;width:52px;border:0;border-left:1px solid var(--line);background:none;font:inherit;font-size:20px;color:var(--muted);cursor:pointer}
.pinbtn[aria-pressed=true]{color:var(--accent)}

/* 시장 화면 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.tile .v.up{color:var(--up)} .tile .v.down{color:var(--down)}
.tile .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 12px;min-width:0}
input[type=search]{flex:1}
select{flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.list{display:flex;flex-direction:column;gap:8px;margin:4px 0 0;padding:0;list-style:none}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item.open{border-color:var(--accent)}
.head{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 12px 12px 14px;cursor:pointer;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.name{font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.unit{font-size:12px;color:var(--muted);font-weight:400}
.price{font-family:var(--display);font-size:22px;text-align:right;line-height:1.1}
.price small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:2px}
.sub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.pill{justify-self:end;font-size:13px;font-weight:600;border-radius:8px;padding:2px 8px;white-space:nowrap}
.pill.up{color:var(--up);background:var(--up-soft)}
.pill.down{color:var(--down);background:var(--down-soft)}
.pill.flat{color:var(--muted);background:var(--bg)}
.spark{display:block}
.more{font:inherit;font-size:14px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:600;cursor:pointer}

.detail{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:14px}
.detail h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.week{display:flex;align-items:flex-end;gap:10px}
.week svg{flex:1;min-width:0;height:64px}
.week .rng{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 4px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:12px}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.corpbtn{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:8px 0;min-height:40px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.corpbtn[aria-pressed=true]{font-weight:600}
tr.sel td{background:var(--accent-soft)}
.hint{margin:0;font-size:12px;color:var(--muted)}
.grade{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px}
.fav{align-self:flex-start;font:inherit;font-size:14px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fav[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
.star{color:var(--accent);font-size:13px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
footer{margin-top:20px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:4px}
footer a{color:var(--accent)}
@media (max-width:360px){.summary{grid-template-columns:1fr 1fr}.summary .tile:last-child{grid-column:1/-1}}
</style>
</head>

</div>

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function round(v,step){return Math.round(v/step)*step;}
function step(b){return b>=50000?500:b>=5000?100:10;}

// 예시용: 최근 7개 경매일 (일요일 제외)
var days=[],d=new Date();
while(days.length<7){ if(d.getDay()!==0) days.unshift(new Date(d)); d.setDate(d.getDate()-1); }
var dayKey=days[6].getFullYear()*10000+(days[6].getMonth()+1)*100+days[6].getDate();

function corpsFor(m){
  return m.id==="garak"?["서울청과","중앙청과","동화청과","한국청과","농협가락공판장"]:["A법인","B법인","C법인","D법인"];
}

var cache={};
function build(m){
  if(cache[m.id])return cache[m.id];
  var CORPS=corpsFor(m),hs=hashStr(m.id),mf=0.92+(hs%17)/100;
  var out=ITEMS.map(function(it,i){
    var r=rng(dayKey*31+i*977+hs), s=step(it.b), p=it.b*mf*(0.9+r()*0.2), week=[];
    for(var k=0;k<7;k++){ p*=1+(r()-0.48)*0.11; week.push(round(p,s)); }
    var today=week[6], prev=week[5], vol=0;
    var grades=GRADES.map(function(g){
      var avg=round(today*g[1]*(0.98+r()*0.04),s);
      var q=Math.round((120+r()*900)*g[2]*(it.b<5000?6:1));
      vol+=q;
      return {g:g[0],avg:avg,hi:round(avg*(1.06+r()*0.08),s),lo:round(avg*(0.86+r()*0.07),s),q:q};
    });
    var corps=CORPS.map(function(c){return {c:c,avg:round(today*(0.95+r()*0.1),s),q:Math.round(vol*(0.12+r()*0.16))};});
    var lots=[];
    for(var j=0;j<30;j++){
      var g=GRADES[r()<.25?0:r()<.7?1:2], min=20*60+30+Math.floor(r()*420);
      lots.push({t:min,c:CORPS[j%CORPS.length],o:it.o[Math.floor(r()*it.o.length)],g:g[0],
        q:Math.round(8+r()*140),p:round(today*g[1]*(0.9+r()*0.2),s)});
    }
    lots.sort(function(a,b){return b.t-a.t;});
    return {id:"s"+i,n:it.n,v:it.v,u:it.u,c:it.c,week:week,wdays:null,today:today,prev:prev,
      pct:(today-prev)/prev*100,diff:today-prev,vol:vol,grades:grades,corps:corps,lots:lots};
  });
  cache[m.id]=out;
  return out;
}

    var done=false,to=setTimeout(function(){if(!done){done=true;rej(new Error("timeout"));}},8000);
    fetch(url,{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})

function spark(week,w,h,k,big){
  var n=week.length,lo=Math.min.apply(null,week),hi=Math.max.apply(null,week),pad=big?6:3,span=hi-lo;
  var pts=week.map(function(v,i){
    var f=span?(v-lo)/span:0.5;
    return [n>1?pad+i*(w-pad*2)/(n-1):w/2, pad+(h-pad*2)*(1-f)];
  });
  var col=k==="up"?"var(--up)":k==="down"?"var(--down)":"var(--muted)";
  var s=svg("svg",{viewBox:"0 0 "+w+" "+h,width:big?"100%":w,height:h,"aria-hidden":"true",preserveAspectRatio:"none"});
  s.setAttribute("class","spark");
  if(big){
    [0.25,0.5,0.75].forEach(function(f){s.appendChild(svg("line",{x1:pad,x2:w-pad,y1:h*f,y2:h*f,stroke:"var(--line)","stroke-width":1,"vector-effect":"non-scaling-stroke"}));});
    if(n>1){
      var area="M"+pts[0][0]+","+(h-pad)+" "+pts.map(function(p){return "L"+p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ")+" L"+pts[n-1][0]+","+(h-pad)+" Z";
      s.appendChild(svg("path",{d:area,fill:col,opacity:.12}));
    }
  }
  if(n>1)s.appendChild(svg("polyline",{points:pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" "),fill:"none",stroke:col,"stroke-width":big?2:1.6,"stroke-linejoin":"round","stroke-linecap":"round","vector-effect":"non-scaling-stroke"}));
  if(!big||n===1)s.appendChild(svg("circle",{cx:pts[n-1][0],cy:pts[n-1][1],r:2.4,fill:col}));
  return s;
}

function buildChips(){
  var cnt={};
  DATA.forEach(function(x){cnt[x.c]=(cnt[x.c]||0)+1;});
  var cats=Object.keys(cnt).sort(function(a,b){
    var ia=CATS.indexOf(a),ib=CATS.indexOf(b);
    if(ia>=0&&ib>=0)return ia-ib;
    return cnt[b]-cnt[a];
  });
  cats=["전체","관심"].concat(cats);
  if(cats.indexOf(state.cat)<0)state.cat="전체";
  $chips.textContent="";
  cats.forEach(function(c){
    var b=el("button","chip",c==="관심"?"★ 관심":c);b.type="button";b.dataset.cat=c;
    b.addEventListener("click",function(){state.cat=c;state.limit=SHOW;render();});
    $chips.appendChild(b);
  });
}

function renderSummary(){
  var box=document.getElementById("summary");box.textContent="";
  if(!DATA.length)return;
  var up=DATA.filter(function(x){return dir(x.pct)==="up";}).length,
      dn=DATA.filter(function(x){return dir(x.pct)==="down";}).length,
      top=DATA.slice().sort(function(a,b){return b.pct-a.pct;})[0],
      bot=DATA.slice().sort(function(a,b){return a.pct-b.pct;})[0];
  function tile(k,v,cls,s){var x=el("div","tile");x.appendChild(el("div","k",k));x.appendChild(el("div","v num "+cls,v));x.appendChild(el("div","s num",s));return x;}
  box.appendChild(tile("오른 품목 / 내린 품목",up+" / "+dn,"","전체 "+DATA.length+"개 품목"));
  box.appendChild(tile("가장 많이 오름",top.n+(top.v?" ("+top.v+")":""),"up",pctText(top.pct)));
  box.appendChild(tile("가장 많이 내림",bot.n+(bot.v?" ("+bot.v+")":""),"down",pctText(bot.pct)));
}

function showMarket(m,my){
  if(curMarket!==m.id){
    curMarket=m.id;
    state.q="";state.cat="전체";state.sort="name";state.open=null;state.corp={};state.limit=SHOW;
    document.getElementById("q").value="";document.getElementById("sort").value="name";
  }
  $home.hidden=true;$mkt.hidden=false;
  document.title=m.n+" 경락가";
  document.getElementById("mtitle").textContent=m.n+" 경락가";
  function finish(dateStr){
    document.getElementById("date").textContent=dateStr;
    buildChips();renderSummary();render();
  }
  function empty(msg){
    DATA=[];$chips.textContent="";document.getElementById("summary").textContent="";
    $list.textContent="";$list.appendChild(el("li","empty",msg));
  }
  if(!REAL){
    DATA=build(m);setNotice("m","sample",SAMPLE_NOTE);setFoot(false);finish(dateText);return;
  }
  setFoot(true);
  var info=realInfo(m.id);
  if(!info){
    setNotice("m","none","이 시장은 아직 수집하지 않습니다.");
    document.getElementById("date").textContent="";
    empty("저장소의 scripts/markets.json 에서 active 목록에 '"+m.id+"'를 추가하면 다음 갱신부터 시세가 나옵니다.");
    return;
  }
  document.getElementById("date").textContent="";
  empty("불러오는 중입니다.");
  getJSON("data/"+m.id+".json").then(function(j){
    if(my!==token)return;
    DATA=mapReal(j);
    setNotice("m","real","기준일 "+dateLabel(j.date)+" · 갱신 "+genLabel(j.generated)+(j.total_items>j.items.length?" · 물량 많은 "+j.items.length+"개 품목만 표시":""));
    finish("");
  }).catch(function(){
    if(my!==token)return;
    setNotice("m","none","데이터를 불러오지 못했습니다.");
    empty("잠시 뒤 다시 열어 보세요. 계속 안 나오면 저장소의 Actions 실행 기록을 확인해 주세요.");
  });
}

/* ---------- 조작부 연결 ---------- */
document.getElementById("q").addEventListener("input",function(e){state.q=e.target.value;state.limit=SHOW;render();});
document.getElementById("sort").addEventListener("change",function(e){state.sort=e.target.value;state.limit=SHOW;render();});
document.getElementById("msearch").addEventListener("input",function(e){msearch=e.target.value;renderAll();});

/* ---------- 주소 해시로 화면 전환 ---------- */
function route(){
  var id="";
  try{id=decodeURIComponent((location.hash||"").replace(/^#/,""));}catch(e){}
  var m=find(id),my=++token;
  realReady.then(function(){
    if(my!==token)return;
    if(m)showMarket(m,my);else{curMarket=null;showHome();}
    try{window.scrollTo(0,0);}catch(e){}
  });
}
window.addEventListener("hashchange",route);
route();
})();
</script>
